# ========================================
# Redisson Configuration for Production Environment
# ========================================
# This configuration is optimized for production environment
# with Redis cluster support and high-performance settings

# Production uses Redis Cluster for high availability
clusterServersConfig:
  # Redis cluster nodes (will be set via environment variables)
  nodeAddresses:
    - "redis://redis-cluster-1:6379"
    - "redis://redis-cluster-2:6379"
    - "redis://redis-cluster-3:6379"
  
  # Redis password for production (must be set via environment)
  password: null
  
  # Master connection pool settings (optimized for production load)
  masterConnectionMinimumIdleSize: 10
  masterConnectionPoolSize: 64
  
  # Slave connection pool settings
  slaveConnectionMinimumIdleSize: 10
  slaveConnectionPoolSize: 64
  
  # Subscription connection settings
  subscriptionConnectionMinimumIdleSize: 1
  subscriptionConnectionPoolSize: 50
  subscriptionConnectionTimeout: 10000
  
  # Timeout settings (optimized for production)
  timeout: 3000
  retryAttempts: 3
  retryInterval: 1500
  
  # TCP settings for production
  keepAlive: true
  tcpNoDelay: true
  
  # Cluster-specific settings
  scanInterval: 1000
  readMode: "SLAVE"
  subscriptionMode: "MASTER"
  
  # Load balancer settings
  loadBalancer: !<org.redisson.connection.balancer.RoundRobinLoadBalancer> {}

# Thread configuration for production (larger thread pools)
threads: 32
nettyThreads: 64

# JSON codec for object serialization
codec: !<org.redisson.codec.JsonJacksonCodec> {}

# Transport mode
transportMode: "NIO"

# Production-specific settings
lockWatchdogTimeout: 30000
reliableTopicWatchdogTimeout: 600000