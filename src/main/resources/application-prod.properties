# ========================================
# Production Environment Configuration
# ========================================

# Server Configuration
# Standard HTTP port for production
server.port=${SERVER_PORT:8080}

# Server Performance Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# Database Configuration - Production Database
# Production database with high availability setup
spring.datasource.url=${DB_URL:jdbc:mysql://prod-db-cluster:3306/sync_prod?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration - HikariCP
# Optimized for high-load production environment
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# MyBatis Configuration
# Production optimized settings
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.easydeals.sync.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis.configuration.cache-enabled=true
mybatis.configuration.lazy-loading-enabled=true
mybatis.configuration.aggressive-lazy-loading=false

# Redis Configuration - Production Redis Cluster
# Production Redis cluster configuration
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES}
spring.data.redis.cluster.max-redirects=3
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=8
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# Redisson Configuration
spring.redisson.config=classpath:redisson.yml

# Logging Configuration
# Production logging with WARN level and file rotation
logging.basePath=${LOG_PATH:/app/logs}
logging.level.root=WARN
logging.level.com.easydeals.sync=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.ibatis=WARN
logging.config=classpath:logback-spring.xml

# Task Configuration
# Optimized batch size for production throughput
task.batch-size=${TASK_BATCH_SIZE:5}

# Security Configuration
# Production security settings
spring.security.user.name=${SECURITY_USER}
spring.security.user.password=${SECURITY_PASSWORD}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}

# JPA Configuration (if needed)
# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

# Actuator Configuration
# Minimal endpoints exposure for production security
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.security.enabled=true
management.server.port=${MANAGEMENT_PORT:8081}

# External Service Configuration
# Production service URLs and timeouts
external.crm.api.url=${CRM_API_URL}
external.crm.api.timeout=${CRM_API_TIMEOUT:15000}
external.crm.api.retry.max-attempts=${CRM_RETRY_MAX:5}
external.crm.api.retry.delay=${CRM_RETRY_DELAY:2000}

# Rate Limiting Configuration
# Production rate limits
rate.limit.crm.requests-per-minute=${RATE_LIMIT_CRM:100}
rate.limit.crm.wait-timeout=${RATE_LIMIT_WAIT:60000}

# Circuit Breaker Configuration
# Resilience4j circuit breaker settings
resilience4j.circuitbreaker.instances.crm-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.crm-api.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.crm-api.sliding-window-size=10

# Monitoring and Metrics
# Production monitoring configuration - Spring Boot 3.x compatible
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=prod

# JVM Configuration
# Production JVM tuning (set via environment variables)
# -Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200