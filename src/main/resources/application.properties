# ========================================
# Common Configuration for All Environments
# ========================================

# Application Information
spring.application.name=sync
spring.application.version=@project.version@

# Active Profile Configuration
# Manually select which environment configuration to use
# Options: local, dev, prod
# You can override this by setting SPRING_PROFILES_ACTIVE environment variable
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ========================================
# Common MyBatis Configuration
# ========================================
# These settings are shared across all environments
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.easydeals.sync.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ========================================
# Common Redisson Configuration
# ========================================
# Redisson configuration file location
spring.redisson.config=classpath:redisson.yml

# ========================================
# Common Logging Configuration
# ========================================
# Logback configuration file location
logging.config=classpath:logback-spring.xml

# ========================================
# Common Application Configuration
# ========================================
# Default task configuration (can be overridden in environment-specific files)
task.batch-size=3

# ========================================
# Spring Boot Configuration
# ========================================
# Common Spring Boot settings
spring.main.banner-mode=console
spring.output.ansi.enabled=detect

# ========================================
# Environment-Specific Configuration Files
# ========================================
# The following files contain environment-specific configurations:
# - application-local.properties: Local development environment
# - application-dev.properties: Test/Development environment  
# - application-prod.properties: Production environment
#
# To switch environments, change the spring.profiles.active property above
# or set the SPRING_PROFILES_ACTIVE environment variable
# ========================================