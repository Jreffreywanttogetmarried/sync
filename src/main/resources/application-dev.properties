# ========================================
# Development/Test Environment Configuration
# ========================================

# Server Configuration
# Use different port for test environment to avoid conflicts
server.port=8061

# Database Configuration - Test Database
# Test database connection with Docker container name
spring.datasource.url=jdbc:mysql://sync-test-mysql:3306/sync_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration - HikariCP
# Moderate pool size for test environment
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# MyBatis Configuration
# Balanced logging for test environment
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.easydeals.sync.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis.configuration.cache-enabled=true

# Redis Configuration - Test Redis
# Test Redis instance with Docker container name
spring.data.redis.host=sync-test-redis
spring.data.redis.port=6379
spring.data.redis.database=14
# No password configured for dev environment
# spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=3000ms

# Redisson Configuration
spring.redisson.config=classpath:redisson-dev.yml

# Logging Configuration
# INFO level for test environment
logging.basePath=${LOG_PATH:logs}
logging.level.root=INFO
logging.level.com.easydeals.sync=INFO
logging.level.org.springframework=INFO
logging.level.org.apache.ibatis=INFO
logging.config=classpath:logback-spring.xml

# Task Configuration
# Moderate batch size for test environment
task.batch-size=3


# JPA Configuration (if needed)
# Disable SQL logging in test environment
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator Configuration
# Limited endpoints exposure for test environment
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Call Back Configuration
callback.aom.url=https://dev.aomdisplays.com/?route=tool/sync_callback.syncCallback