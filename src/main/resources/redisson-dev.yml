# ========================================
# Redisson Configuration for Development Environment
# ========================================
# This configuration is optimized for development and testing environments
# with single Redis instance and relaxed connection settings

singleServerConfig:
  # Redis server address for development environment
  # Uses localhost by default, can be overridden by Docker Compose
  address: "redis://redis-dev:6379"
  
  # Redis password (null for development, can be set via environment)
  password: null
  
  # Database index for development (separate from production)
  database: 13
  
  # Connection pool settings for development (smaller pools)
  connectionMinimumIdleSize: 5
  connectionPoolSize: 32
  
  # DNS monitoring interval (longer for development)
  dnsMonitoringInterval: 10000
  
  # Subscription connection settings (smaller pools for dev)
  subscriptionConnectionMinimumIdleSize: 1
  subscriptionConnectionPoolSize: 25
  subscriptionConnectionTimeout: 15000
  
  # Timeout settings (more lenient for development)
  timeout: 5000
  retryAttempts: 2
  retryInterval: 2000
  
  # TCP settings
  keepAlive: false
  tcpNoDelay: true

# Thread configuration for development (smaller thread pools)
threads: 8
nettyThreads: 16

# JSON codec for object serialization
codec: !<org.redisson.codec.JsonJacksonCodec> {}

# Transport mode
transportMode: "NIO"