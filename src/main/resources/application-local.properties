# ========================================
# Local Development Environment Configuration
# ========================================

# Server Configuration
# Use default port for local development
server.port=8060

# Database Configuration - Local MySQL
# Local database connection for development
spring.datasource.url=jdbc:mysql://localhost:3306/sync?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration - HikariCP
# Optimized for local development with smaller pool size
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# MyBatis Configuration
# Enable detailed SQL logging for development
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.easydeals.sync.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis.configuration.cache-enabled=false

# Redis Configuration - Local Redis
# Local Redis instance for development
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=13
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Redisson Configuration
spring.redisson.config=classpath:redisson.yml

# Logging Configuration
# Debug level for local development
logging.basePath=logs
logging.level.root=INFO
logging.level.com.easydeals.sync=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.ibatis=DEBUG
logging.config=classpath:logback-spring.xml

# Task Configuration
# Smaller batch size for local testing
task.batch-size=2

# Development Tools Configuration
# Enable hot reload and development features
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# JPA Configuration (if needed)
# Show SQL statements in console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
# Enable all endpoints for local monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always