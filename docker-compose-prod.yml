
services:
  # MySQL数据库服务
  sync-prod-mysql:
    image: mysql:8.0
    container_name: sync-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 43jhn6io34S!
      MYSQL_DATABASE: sync_prod
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - sync-prod-network
    # 生产环境资源配置
    deploy:
      resources:
        limits:
          memory: 2G       # 生产环境增加内存限制
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 5
        window: 300s
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p43jhn6io34S!"]
      timeout: 30s
      retries: 5
      interval: 30s
      start_period: 60s

  # Redis缓存服务
  sync-prod-redis:
    image: redis:7-alpine
    container_name: sync-prod-redis
    restart: on-failure:3  # 失败时最多重启3次
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - sync-prod-network
    # 生产环境资源配置
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 20s
      start_period: 30s

  # Spring Boot应用服务
  sync-prod-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sync-prod-app
    restart: on-failure:5
    ports:
      - "8061:8061"
    volumes:
      - ./data/logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      # 生产环境JVM参数优化
      - JAVA_OPTS=-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/
    depends_on:
      sync-prod-mysql:
        condition: service_healthy
      sync-prod-redis:
        condition: service_healthy
    networks:
      - sync-prod-network
    # 生产环境资源配置
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 30s         # 增加重启延迟
        max_attempts: 5    # 增加重启次数
        window: 600s       # 增加监控窗口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8061/actuator/health"]
      timeout: 30s         # 增加超时时间
      retries: 5           # 增加重试次数
      interval: 60s        # 增加检查间隔
      start_period: 120s   # 增加启动等待期

# 网络配置
networks:
  sync-prod-network:
    driver: bridge
    name: sync-prod-network

# 生产环境数据目录说明：
# 请确保在项目根目录下创建以下目录：
# - data/mysql (MySQL数据存储)
# - data/redis (Redis数据存储)
# - data/logs (应用日志存储)