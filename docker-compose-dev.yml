# ========================================
# Docker Compose Configuration for Development Environment
# ========================================
# This configuration sets up a complete development environment with:
# - Spring Boot application
# - MySQL database
# - Redis cache
# - Volume mounts for development
# - Network configuration for service communication

version: '3.8'

services:
  # ========================================
  # Spring Boot Application Service
  # ========================================
  sync-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SPRING_PROFILE=dev
    container_name: sync-app-dev
    ports:
      - "8080:8080"
      - "8081:8081"  # Management port
    environment:
      # Spring Profile Configuration
      - SPRING_PROFILES_ACTIVE=dev
      
      # Database Configuration
      - DB_URL=jdbc:mysql://mysql-dev:3306/sync_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=sync_dev
      - DB_PASSWORD=dev_password
      
      # Redis Configuration
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      
      # Logging Configuration
      - LOG_PATH=/app/logs
      
      # Security Configuration
      - SECURITY_USER=dev_admin
      - SECURITY_PASSWORD=dev_admin_pass
      
      # External API Configuration
      - CRM_API_URL=https://dev-api.crm.company.com
      - CRM_API_TIMEOUT=10000
      
      # Rate Limiting Configuration
      - RATE_LIMIT_CRM=50
      - RATE_LIMIT_WAIT=30000
      
      # JVM Configuration
      - JAVA_OPTS=-Xms512m -Xmx1g -XX:+UseG1GC -Dspring.config.additional-location=classpath:/redisson-dev.yml
    volumes:
      # Mount logs directory for development debugging
      - ./logs:/app/logs
      # Mount application properties for hot reload (optional)
      # - ./src/main/resources:/app/config:ro
    depends_on:
      mysql-dev:
        condition: service_healthy
      redis-dev:
        condition: service_started
    networks:
      - sync-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================================
  # MySQL Database Service
  # ========================================
  mysql-dev:
    image: mysql:8.0
    container_name: mysql-dev
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=sync_dev
      - MYSQL_USER=sync_dev
      - MYSQL_PASSWORD=dev_password
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      # Persistent data storage
      - mysql_dev_data:/var/lib/mysql
      # Initialize database with SQL scripts
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d:ro
      # MySQL configuration
      - ./docker/mysql/dev.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - sync-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sync_dev", "-pdev_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # ========================================
  # Redis Cache Service
  # ========================================
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      # Persistent data storage
      - redis_dev_data:/data
      # Redis configuration
      - ./docker/redis/dev.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - sync-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server /usr/local/etc/redis/redis.conf

  # ========================================
  # Development Tools (Optional)
  # ========================================
  # Redis Commander - Web-based Redis management tool
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-dev
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis-dev:6379
    depends_on:
      - redis-dev
    networks:
      - sync-network
    restart: unless-stopped
    profiles:
      - tools

  # phpMyAdmin - Web-based MySQL management tool
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-dev
    ports:
      - "8083:80"
    environment:
      - PMA_HOST=mysql-dev
      - PMA_PORT=3306
      - PMA_USER=sync_dev
      - PMA_PASSWORD=dev_password
    depends_on:
      - mysql-dev
    networks:
      - sync-network
    restart: unless-stopped
    profiles:
      - tools

# ========================================
# Network Configuration
# ========================================
networks:
  sync-network:
    driver: bridge
    name: sync-dev-network

# ========================================
# Volume Configuration
# ========================================
volumes:
  mysql_dev_data:
    name: sync_mysql_dev_data
    driver: local
  redis_dev_data:
    name: sync_redis_dev_data
    driver: local